<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings - Text Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    .note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
    code { font-size: 12px; }
    /* Embedded in the popup's <iframe>: the host page already shows a "Settings" heading.
       Also shrink everything down — the iframe sits in a narrow 400px-wide popup. */
    html.embedded h1 { display: none; }
    html.embedded body { font-size: 12px; }
    html.embedded main { margin: 10px auto; padding: 0 10px; }
    html.embedded .card { padding: 8px; }
    html.embedded label { margin: 10px 0 4px; }
    html.embedded .note { padding: 6px 8px; margin-top: 8px; }
    html.embedded button { padding: 4px 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Transcription Settings</h1>
    <div class="card">
      <label for="provider">Transcription method</label>
      <select id="provider"></select>
      <div class="note muted" id="providerNote"></div>

      <div id="keyRow">
        <label for="apiKey">API Key</label>
        <input id="apiKey" type="password" placeholder="sk-... / gsk_..." autocomplete="off">
        <div class="muted" id="keyHelp"></div>
      </div>

      <div id="localRow">
        <label for="localUrl">Local Server URL</label>
        <div class="row" style="flex-wrap:nowrap">
          <input id="localUrl" placeholder="http://127.0.0.1:8765/v1">
          <button id="testLocal" style="white-space:nowrap">Test</button>
        </div>
        <div class="muted" id="localStatus"></div>
      </div>

      <label for="model">Model</label>
      <select id="model"></select>

      <label for="language">Audio language</label>
      <select id="language">
        <option value="">Auto-detect (recommended)</option>
        <option value="en">English</option>
        <option value="th">Thai</option>
        <option value="ja">Japanese</option>
        <option value="zh">Chinese</option>
        <option value="ko">Korean</option>
      </select>
      <div class="muted">Must match the language spoken in the video — picking the wrong one makes Whisper try to translate and produce garbled text.</div>

      <div class="row" style="margin-top:20px">
        <button id="save" class="primary">Save</button>
        <span id="saved" class="muted"></span>
      </div>
    </div>
    <p class="muted">All settings are stored locally on this device (chrome.storage.local) — your API key is only sent to the provider you choose, at transcription time.</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
