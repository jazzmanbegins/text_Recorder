<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>ไฟล์ที่อัดไว้ - Text Recorder</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card { margin-bottom: 12px; }
    .card.highlight { border-color: var(--accent); }
    audio { width: 100%; margin: 10px 0; }
    textarea { min-height: 160px; resize: vertical; margin-top: 10px; line-height: 1.7; }
    .title { word-break: break-word; }
    #empty { text-align: center; padding: 48px 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>📂 ไฟล์เสียงที่อัดไว้</h1>
      <a href="options.html">⚙️ ตั้งค่า API</a>
    </header>
    <div id="list"></div>
    <div id="empty" class="muted" hidden>ยังไม่มีไฟล์ — เปิดวิดีโอแล้วกดไอคอน extension เพื่อเริ่มอัดเสียง</div>
  </main>

  <template id="item">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 class="title"></h2>
        <button class="danger" data-act="delete">ลบ</button>
      </div>
      <div class="muted meta"></div>
      <audio controls preload="metadata"></audio>
      <div class="row">
        <button class="primary" data-act="transcribe">📝 ถอดเป็นข้อความ</button>
        <button data-act="download-audio">⬇️ ไฟล์เสียง (.webm)</button>
        <span class="muted status"></span>
      </div>
      <div class="error"></div>
      <div class="transcript" hidden>
        <textarea readonly></textarea>
        <div class="row" style="margin-top:8px">
          <button data-act="copy">📋 คัดลอก</button>
          <button data-act="download-txt">⬇️ .txt</button>
          <button data-act="download-srt">⬇️ .srt</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="recordings.js"></script>
</body>
</html>
